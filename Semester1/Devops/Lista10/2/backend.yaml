apiVersion: v1
kind: Service
metadata:
  name: backend-app
spec:
  clusterIP: None
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: whoami
        image: traefik/whoami
        ports:
        - containerPort: 80